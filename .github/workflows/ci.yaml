name: CI - Generar README como artefacto

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pytest
        run: python -m pip install pytest

      - name: Ejecutar pruebas y actualizar README
        run: python update_readme.py

      - name: Subir README como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: readme-generado
          path: README.md
